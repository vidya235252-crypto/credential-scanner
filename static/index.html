<!DOCTYPE html>
<html>
<head>
    <title>Credential Scanner Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        input { padding: 8px; width: 300px; }
        button { padding: 8px 16px; margin-left: 8px; }
        .finding { border-left: 4px solid #ccc; padding: 8px; margin: 8px 0; }
        .HIGH { border-left-color: red; }
        .MEDIUM { border-left-color: orange; }
        .scan-row { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
        .scan-row:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Credential Scanner Dashboard</h1>

    <div>
        <input id="repoInput" type="text" placeholder="owner/repo">
        <button onclick="runScan()">Scan</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>

    <h2>Scan History</h2>
    <div id="history"></div>

    <script>
        async function runScan() {
            const input = document.getElementById("repoInput").value;
            const [owner, repo] = input.split("/");
            const statusDiv = document.getElementById("status");
            const resultsDiv = document.getElementById("results");

            if (!owner || !repo) {
                statusDiv.innerText = "Enter as owner/repo";
                return;
            }

            statusDiv.innerText = "Scanning...";
            resultsDiv.innerHTML = "";

            try {
                const response = await fetch("/scan", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ owner: owner, repo: repo })
                });

                if (!response.ok) {
                    const err = await response.json();
                    statusDiv.innerText = "Error: " + err.detail;
                    return;
                }

                const data = await response.json();
                statusDiv.innerText = `Found ${data.findings_count} finding(s), skipped ${data.skipped_count} file(s).`;

                data.findings.forEach(f => {
                    const severity = f.method === "pattern" ? "HIGH" : "MEDIUM";
                    const div = document.createElement("div");
                    div.className = "finding " + severity;
                    div.innerText = `[${severity}] ${f.file} — ${f.type}: ${f.match}`;
                    resultsDiv.appendChild(div);
                });

                loadHistory();
            } catch (e) {
                statusDiv.innerText = "Request failed: " + e;
            }
        }

        async function loadHistory() {
            const response = await fetch("/scans");
            const scans = await response.json();
            const historyDiv = document.getElementById("history");
            historyDiv.innerHTML = "";

            scans.forEach(scan => {
                const div = document.createElement("div");
                div.className = "scan-row";
                div.innerText = `#${scan.id} — ${scan.owner}/${scan.repo} — ${scan.scanned_at}`;
                historyDiv.appendChild(div);
            });
        }

        loadHistory();
    </script>
</body>
</html>
