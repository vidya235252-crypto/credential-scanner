<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoSentinel | Sign In</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="/static/favicon.ico">
</head>
<body>
<div class="container auth-container">
    <div class="panel auth-panel">
        <div class="logo">
    <i class="fa-solid fa-shield-halved"></i>
    <h1>RepoSentinel</h1>
</div>
<p class="auth-subtitle">Scan GitHub repos for leaked credentials, with confidence scoring and remediation guidance.</p>
<ul class="auth-features">
    <li><i class="fa-solid fa-check"></i> Pattern + entropy-based secret detection</li>
    <li><i class="fa-solid fa-check"></i> Explainable confidence scoring</li>
    <li><i class="fa-solid fa-check"></i> Real-time scan progress</li>
    <li><i class="fa-solid fa-check"></i> Repository comparison</li>
</ul>
<div class="auth-tabs">
            <button id="loginTab" class="auth-tab active" type="button">Login</button>
            <button id="signupTab" class="auth-tab" type="button">Sign Up</button>
        </div>
        <form id="authForm">
            <input id="emailInput" type="email" placeholder="Email" autocomplete="username" required>
            <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" id="authSubmitBtn">Login</button>
        </form>
<div class="auth-divider"><span>or</span></div>
<a href="/auth/github/login" class="github-btn">
    <i class="fa-brands fa-github"></i> Continue with GitHub
</a>
<div id="authStatus" class="status idle"></div>
    </div>
</div>
<script src="/static/login.js"></script>
</body>
</html>
